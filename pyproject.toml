[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfm-bench"
version = "0.2.0"
description = "Read-only scientific discovery evaluation foundations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dfm-bench = "dfm_bench.cli:main"
dfm-bench-evaluate = "dfm_bench.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dfm_bench = ["rubrics/*.json", "rubrics/clinical/*.md", "rubrics/battery/*.md", "schemas/*.json", "protocols/*.json", "protocols/*.txt"]
